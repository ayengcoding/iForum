<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iForum Core — Official Documentation Portal (v2.4.0)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-header: rgba(255, 255, 255, 0.88);
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-search: #f3f4f6;
      --bg-code: #0f172a;
      --border-color: #e5e7eb;
      --border-subtle: #f1f5f9;
      --text-main: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --brand: #e11d48;
      --brand-light: #fef2f2;
      --brand-border: #fecdd3;
      --brand-glow: rgba(225, 29, 72, 0.06);
      --radius-card: 14px;
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
      --shadow-hover: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    [data-theme="dark"] {
      --bg-page: #0b0f17;
      --bg-sidebar: #0b0f17;
      --bg-header: rgba(11, 15, 23, 0.88);
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --bg-search: #161f30;
      --bg-code: #060911;
      --border-color: #1f2937;
      --border-subtle: #161f30;
      --text-main: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --brand: #f43f5e;
      --brand-light: rgba(244, 63, 94, 0.14);
      --brand-border: rgba(244, 63, 94, 0.3);
      --brand-glow: rgba(244, 63, 94, 0.09);
    }


    :root {
      color-scheme: light;
    }
    [data-theme="dark"] {
      color-scheme: dark;
    }

    /* Custom Sleek Scrollbars (Darkened in Dark Mode) */
    * {
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    [data-theme="dark"] * {
      scrollbar-color: #1f2937 #0b0f17;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    [data-theme="dark"] ::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.7);
    }
    [data-theme="dark"] ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 999px;
    }
    [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================================
       TOP STICKY 2-TIER HEADER (MINTLIFY / CINEPRO STYLE)
       ========================================================================= */
    .doc-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }

    .doc-header-top {
      max-width: 100%;
      margin: 0 auto;
      height: 58px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .brand-logo-img { width: 28px; height: 28px; border-radius: 7px; object-fit: contain; display: inline-block; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

    .header-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }

    .header-pill-btn:hover {
      background: var(--bg-search);
      color: var(--text-main);
    }

    .header-pill-divider {
      width: 1px;
      height: 18px;
      background: var(--border-color);
    }

    /* Search Bar Center */
    .header-search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .header-search-btn {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border-radius: 9px;
      background: var(--bg-search);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .header-search-btn:hover {
      border-color: var(--border-color);
      color: var(--text-secondary);
    }

    .search-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-kbd {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 1px rgba(0,0,0,0.03);
    }

    /* Header Right */
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .gh-repo-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 8px;
      transition: all 0.15s;
    }

    .gh-repo-pill:hover {
      background: var(--bg-search);
      color: var(--text-main);
    }

    .icon-action-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }

    .icon-action-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* Row 2: Sub-navigation Tabs */
    .doc-header-tabs {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 44px;
      overflow-x: auto;
    }

    .header-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 100%;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .header-tab:hover {
      color: var(--text-main);
    }

    .header-tab.active {
      color: var(--text-main);
      font-weight: 600;
      border-bottom-color: var(--brand);
    }

    .header-tab svg {
      width: 15px;
      height: 15px;
      opacity: 0.8;
    }

    .header-tab.active svg {
      color: var(--brand);
      opacity: 1;
    }

    /* =========================================================================
       MAIN SHELL (LEFT SIDEBAR + RIGHT CONTENT AREA)
       ========================================================================= */
    .doc-shell {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      flex: 1;
    }

    /* Left Sidebar */
    .doc-sidebar {
      border-right: 1px solid var(--border-color);
      padding: 24px 18px 60px 24px;
      position: sticky;
      top: 103px;
      height: calc(100vh - 103px);
      overflow-y: auto;
      background: var(--bg-sidebar);
    }

    .sidebar-top-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-ext-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s;
    }

    .sidebar-ext-link:hover {
      background: var(--bg-search);
      color: var(--text-main);
    }

    .sidebar-ext-link svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .sidebar-group {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-group:last-child {
      border-bottom: none;
    }

    .sidebar-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      padding: 4px 10px;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .sidebar-group-title svg {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
    }

    .sidebar-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-nav-btn {
      width: 100%;
      text-align: left;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-nav-btn:hover {
      color: var(--text-main);
      background: var(--bg-search);
    }

    .sidebar-nav-btn.active {
      background: var(--brand-light);
      color: var(--brand);
      font-weight: 600;
    }

    /* =========================================================================
       MAIN ARTICLE AREA (WITH CINEPRO GEOMETRIC CORAL GLOW)
       ========================================================================= */
    .doc-main {
      position: relative;
      padding: 36px 40px 96px;
      overflow: hidden;
    }

    /* Subtle Geometric Coral Backdrop Glow at Top */
    .doc-hero-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 340px;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 65% 80% at 50% -10%, var(--brand-glow) 0%, transparent 75%),
        linear-gradient(135deg, rgba(225, 29, 72, 0.025) 25%, transparent 25%) -32px 0,
        linear-gradient(225deg, rgba(225, 29, 72, 0.025) 25%, transparent 25%) -32px 0;
      background-size: 100% 100%, 64px 64px, 64px 64px;
    }

    .doc-content-inner {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    .doc-eyebrow {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      margin-bottom: 10px;
      display: block;
    }

    .doc-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .doc-title-row h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text-main);
    }

    .doc-action-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .doc-action-pill:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .doc-lead {
      font-size: 16.5px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .doc-section h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin: 36px 0 14px;
    }

    .doc-section h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      margin: 26px 0 10px;
    }

    .doc-section p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .doc-section p strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .doc-underline-highlight {
      color: var(--text-main);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--brand);
      text-underline-offset: 4px;
      text-decoration-thickness: 1.5px;
    }

    /* 2-Column Feature Cards (Exact CinePro Card Style) */
    .doc-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin: 24px 0 32px;
    }

    .doc-feature-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .doc-feature-card:hover {
      border-color: var(--brand-border);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .doc-card-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .doc-card-icon svg {
      width: 22px;
      height: 22px;
    }

    .doc-feature-card h4 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .doc-feature-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0;
    }

    /* Callouts */
    .doc-callout {
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--brand-border);
      background: var(--brand-light);
      margin: 20px 0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .doc-callout svg {
      width: 18px;
      height: 18px;
      color: var(--brand);
      flex-shrink: 0;
      margin-top: 3px;
    }

    .doc-callout-body {
      font-size: 14px;
      color: var(--text-main);
    }

    /* Code Blocks */
    .doc-code-wrap {
      background: var(--bg-code);
      border-radius: 12px;
      overflow: hidden;
      margin: 18px 0 26px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .doc-code-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .doc-copy-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .doc-copy-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .doc-code-wrap pre {
      padding: 16px 18px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.65;
      color: #f8fafc;
    }

    /* Step List */
    .doc-steps {
      list-style: none;
      margin: 18px 0 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .doc-step-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 12px;
    }

    .doc-step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .doc-step-text {
      font-size: 14.5px;
      color: var(--text-secondary);
    }

    .doc-step-text strong {
      color: var(--text-main);
    }

    /* Tables */
    .doc-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin: 18px 0 28px;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .doc-table th,
    .doc-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .doc-table th {
      background: var(--bg-subtle);
      font-weight: 700;
      color: var(--text-main);
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .doc-table tr:last-child td {
      border-bottom: none;
    }

    /* Bottom Prev/Next Navigation */
    .doc-pager {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .doc-pager-btn {
      flex: 1;
      max-width: 48%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .doc-pager-btn.next {
      text-align: right;
      margin-left: auto;
    }

    .doc-pager-btn:hover {
      border-color: var(--brand);
    }

    .doc-pager-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .doc-pager-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--brand);
    }

    /* Search Modal */
    .search-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 90px;
    }

    .search-modal-backdrop.open {
      display: flex;
    }

    .search-modal {
      width: 100%;
      max-width: 560px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .search-input-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      gap: 10px;
    }

    .search-input-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
    }

    .search-results-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 8px;
    }

    .search-result-item {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 9px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .search-result-item:hover {
      background: var(--brand-light);
    }

    .search-result-item strong {
      font-size: 14px;
      color: var(--text-main);
    }

    .search-result-item span {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    @media (max-width: 960px) {
      .doc-shell {
        grid-template-columns: 1fr;
      }
      .doc-sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 18px 20px;
      }
      .doc-main {
        padding: 32px 22px 64px;
      }
      .doc-cards-grid {
        grid-template-columns: 1fr;
      }
      .header-search-wrap {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- STICKY 2-TIER HEADER -->
  <header class="doc-header">

            <h2>Step 1: Install the Theme XML File</h2>
            <p>You can install iForum using either <strong>Restore</strong> (recommended for clean installs) or <strong>Edit HTML</strong>.</p>
            <ul class="doc-steps">
              <li class="doc-step-item">
                <span class="doc-step-num">1</span>
                <div class="doc-step-text">Log into your <strong>Blogger Dashboard</strong>, select your blog, and click <strong>Theme</strong> in the left menu.</div>
              </li>
              <li class="doc-step-item">
                <span class="doc-step-num">2</span>
                <div class="doc-step-text">Click the downward arrow next to the orange <strong>Customize</strong> button and select <strong>Restore</strong>.</div>
              </li>
              <li class="doc-step-item">
                <span class="doc-step-num">3</span>
                <div class="doc-step-text">Click <strong>Upload</strong> and select <code>iForum Premium.xml</code> from your unzipped package. Wait for the <em>Theme restored</em> toast notification.</div>
              </li>
            </ul>

            <h2>Step 2: Configure Responsive Mobile View</h2>
            <p>Ensure Blogger serves iForum's native responsive layout instead of Blogger's legacy mobile skin:</p>

              <li class="doc-step-item">
                <span class="doc-step-num">1</span>
                <div class="doc-step-text">In <strong>Theme</strong>, click the arrow next to <strong>Customize → Mobile settings</strong>.</div>

              <li class="doc-step-item">
                <span class="doc-step-num">2</span>
                <div class="doc-step-text">Select <strong>Desktop</strong> (or Custom) and click <strong>Save</strong>.</div>

            <h2>2. Enable Realtime Database &amp; Security Rules</h2>

}</code></pre>

            <h2>3. Enable Google Sign-In &amp; Authorized Domains</h2>
            <p>Go to <strong>Build → Authentication → Sign-in method</strong>, enable <strong>Google</strong>, select your support email, and click <strong>Save</strong>. Then go to <strong>Authentication → Settings → Authorized domains → Add domain</strong> and enter your blog's domain (e.g. <code>yourblog.blogspot.com</code> or <code>www.yourcustomdomain.com</code>).</p>

              </li>
            </ul>

  &lt;h3&gt;Frequently Asked Questions&lt;/h3&gt;
  
  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;How does the &quot;Locker&quot; system work? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;To view exclusive download links, you must be &lt;b&gt;Logged In&lt;/b&gt; and you must &lt;b&gt;Heart (Like)&lt;/b&gt; the post. Once you click the heart icon, the link card will instantly reveal its download button.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;How do I change my Profile Photo? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;Hover over your username in the top bar to see your Profile Card. Click the &lt;b&gt;&quot;Photo&quot;&lt;/b&gt; button (Camera icon) to upload a new avatar from your device. This change is instant across the forum.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;How do I get a &quot;Best Answer&quot; mark? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;If you provide a solution in a &lt;b&gt;Support&lt;/b&gt; thread, the original poster can click the &quot;Best Answer&quot; button on your comment. This highlights your answer in green and awards you &lt;b&gt;+50 reputation points&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;What should I do if a download link is broken? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;If you encounter a broken link, please &lt;b&gt;Reply&lt;/b&gt; to that thread and mention the author. If the author is inactive, start a thread in the &lt;b&gt;Support&lt;/b&gt; category with a link to the original post so a moderator can assist.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;How do I earn the &quot;Verified&quot; badge? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;You must link your official Blogger profile to your forum account. Open your Profile Card, click the &lt;b&gt;Link Blogger&lt;/b&gt; status, and follow the instructions to sync your display name. Once synced, the blue checkmark badge will appear.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;


  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;How do I report a rule violation? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;If you see spam, harassment, or missing credits, please notify the staff immediately. You can do this by starting a thread in the &lt;b&gt;Support&lt;/b&gt; category or joining our &lt;b&gt;Official Telegram Group&lt;/b&gt; for a faster response.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;What are Reputation Points (REP)? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;Reputation is a measure of your contribution to the community. You earn points when people heart your posts (+5) or mark your comment as the best answer (+50). Higher reputation unlocks new medals like &lt;b&gt;Rising Star&lt;/b&gt;, &lt;b&gt;Master&lt;/b&gt;, and &lt;b&gt;Legend&lt;/b&gt;.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;Why was my post deleted? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;Posts are usually removed if they violate our &lt;a href=&quot;/p/community-guidelines.html&quot; style=&quot;color:var(--accent); font-weight:800;&quot;&gt;Guidelines&lt;/a&gt;. Common reasons include: using languages other than English, missing credits for shared files, or posting in the wrong category.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;How do I get a &quot;Best Answer&quot; mark? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;
      &lt;p&gt;If you help someone in a &lt;b&gt;Support&lt;/b&gt; thread, the thread creator can mark your comment as the &quot;Best Answer.&quot; This awards you extra reputation points and a special badge.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;post-accordion&quot;&gt;
    &lt;div class=&quot;acc-header&quot;&gt;Why was my post deleted? &lt;i class=&quot;hgi hgi-stroke hgi-arrow-down-01&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;acc-body&quot;&gt;

  &lt;/div&gt;

    function loadDoc(docId) {
      const data = DOCS_DATA[docId] || DOCS_DATA.intro;
      const container = document.getElementById('doc-article-container');

      let pagerHtml = '<div class="doc-pager">';
      if (data.prev) {
        pagerHtml += `<button class="doc-pager-btn prev" onclick="loadDoc('${data.prev.id}')"><span class="doc-pager-label">← Previous</span><span class="doc-pager-title">${data.prev.title}</span></button>`;
      }
      if (data.next) {
        pagerHtml += `<button class="doc-pager-btn next" onclick="loadDoc('${data.next.id}')"><span class="doc-pager-label">Next →</span><span class="doc-pager-title">${data.next.title}</span></button>`;
      }
      pagerHtml += '</div>';

      container.innerHTML = `
        <span class="doc-eyebrow">${data.eyebrow}</span>
        <div class="doc-title-row">
          <h1>${data.title}</h1>
          <a href="https://iforumofficial.blogspot.com/" target="_blank" rel="noopener" class="doc-action-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>Open Live Demo</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </a>
        </div>
        <p class="doc-lead">${data.lead}</p>
        ${data.html}
        ${pagerHtml}
      `;

      document.querySelectorAll('.sidebar-nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-doc') === docId);
      });

      document.querySelectorAll('.header-tab').forEach(tab => {
        const t = tab.getAttribute('data-tab');
        tab.classList.toggle('active', t === docId || (docId !== 'firebase' && docId !== 'typography' && docId !== 'changelog' && t === 'intro'));
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyCodeBlock(btn) {
      const code = btn.closest('.doc-code-wrap').querySelector('code').innerText;
      navigator.clipboard.writeText(code);
      const orig = btn.innerText;
      btn.innerText = 'Copied!';
      setTimeout(() => { btn.innerText = orig; }, 1600);
    }

    function toggleMobileSidebar(force) {
      const sidebar = document.querySelector('.doc-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const toggle = document.getElementById('mobile-menu-toggle');
      if (!sidebar) return;
      const isOpen = force !== undefined ? force : !sidebar.classList.contains('mobile-open');
      sidebar.classList.toggle('mobile-open', isOpen);
      if (backdrop) backdrop.classList.toggle('active', isOpen);
      if (toggle) {
        const iconOpen = toggle.querySelector('.icon-menu-open');
        const iconClose = toggle.querySelector('.icon-menu-close');
        if (iconOpen && iconClose) {
          iconOpen.style.display = isOpen ? 'none' : 'block';
          iconClose.style.display = isOpen ? 'block' : 'none';
        }
      }
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    function toggleTheme() {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
    }

    function openSearchModal() {
      const modal = document.getElementById('search-modal');
      modal.classList.add('open');
      const input = document.getElementById('search-modal-input');
      input.value = '';
      filterSearchResults('');
      setTimeout(() => input.focus(), 50);
    }

    function closeSearchModal() {
      document.getElementById('search-modal').classList.remove('open');
    }

    function filterSearchResults(q) {
      const list = document.getElementById('search-results-list');
      const query = q.trim().toLowerCase();
      const entries = Object.entries(DOCS_DATA).filter(([id, d]) => {
        if (!query) return true;
        return d.title.toLowerCase().includes(query) || d.lead.toLowerCase().includes(query) || d.html.toLowerCase().includes(query);
      });
      list.innerHTML = entries.map(([id, d]) => `
        <button type="button" class="search-result-item" onclick="loadDoc('${id}'); closeSearchModal();">
          <strong>${d.title}</strong>
          <span>${d.lead}</span>
        </button>
      `).join('');
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeSearchModal();
      }
    });

    loadDoc('intro');
  </script>
